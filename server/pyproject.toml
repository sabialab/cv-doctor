[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-doctor"
version = "0.1.0"
description = "LLM 驱动的简历深度优化工具 — 针对具体公司+岗位精准优化"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "CV-Doctor Team" },
]
keywords = ["resume", "cv", "optimizer", "llm", "ats", "job", "career", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "litellm>=1.40.0",
    "marker-pdf>=0.2.0",
    "python-docx>=1.1.0",
    "weasyprint>=62.0",
    "scikit-learn>=1.5.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "playwright>=1.45.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
cv-doctor = "src.cli:app"

[project.urls]
Homepage = "https://github.com/your-username/cv-doctor"
Repository = "https://github.com/your-username/cv-doctor"
Issues = "https://github.com/your-username/cv-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
